<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Läraren Sebastians fantastiska ting och där du hittar dem</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f5f0e8;
  --card: #fffcf7;
  --text: #2c2825;
  --text-mid: #5c554e;
  --text-light: #8a8279;
  --ink: #1a1714;
  --accent: #c45a34;
  --accent-hover: #a84828;
  --border: #e0d8cc;
  --border-light: #ede7dc;
  --shadow: 0 1px 3px rgba(44,40,37,0.06), 0 6px 16px rgba(44,40,37,0.06);
  --shadow-hover: 0 2px 8px rgba(44,40,37,0.08), 0 12px 32px rgba(44,40,37,0.1);
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* Subtle paper texture via noise */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  background-size: 256px 256px;
  pointer-events: none;
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding: 48px 24px 120px;
}

/* Header - editorial / old-book feel */
.header {
  text-align: center;
  margin-bottom: 56px;
  animation: fadeUp 0.6s ease both;
}

.ornament {
  font-size: 1.6rem;
  color: var(--accent);
  letter-spacing: 12px;
  margin-bottom: 20px;
  opacity: 0.7;
}

h1 {
  font-family: 'Crimson Pro', serif;
  font-weight: 700;
  font-size: clamp(1.8rem, 5vw, 2.6rem);
  line-height: 1.2;
  color: var(--ink);
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}

h1 em {
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
}

.subtitle {
  font-family: 'Crimson Pro', serif;
  font-size: 1.05rem;
  color: var(--text-light);
  font-style: italic;
}

.divider {
  width: 60px;
  height: 2px;
  background: var(--accent);
  margin: 24px auto 0;
  opacity: 0.5;
}

/* Filter tags */
.filters {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 32px;
  flex-wrap: wrap;
  animation: fadeUp 0.6s ease 0.1s both;
}

.filter-btn {
  padding: 7px 16px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-mid);
  cursor: pointer;
  transition: all 0.2s;
}

.filter-btn:hover, .filter-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(196,90,52,0.06);
}

/* App grid */
.apps {
  display: grid;
  gap: 14px;
}

/* App card */
.app-card {
  display: grid;
  grid-template-columns: 52px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 20px 22px;
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: 14px;
  box-shadow: var(--shadow);
  text-decoration: none;
  color: inherit;
  transition: all 0.25s ease;
  animation: fadeUp 0.5s ease both;
}

.app-card:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
  border-color: var(--border);
}

.app-card:hover .arrow {
  transform: translateX(3px);
  color: var(--accent);
}

.app-icon {
  width: 52px;
  height: 52px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  flex-shrink: 0;
}

.app-info {
  min-width: 0;
}

.app-name {
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 2px;
  color: var(--ink);
}

.app-desc {
  font-size: 0.85rem;
  color: var(--text-light);
  line-height: 1.4;
}

.app-tags {
  display: flex;
  gap: 5px;
  margin-top: 6px;
  flex-wrap: wrap;
}

.tag {
  font-size: 0.7rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--border-light);
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.arrow {
  font-size: 1.2rem;
  color: var(--text-light);
  transition: all 0.2s;
  flex-shrink: 0;
}

/* Category colors */
.cat-svenska { background: #e8f5e9; }
.cat-matte { background: #e3f2fd; }
.cat-verktyg { background: #fff3e0; }
.cat-engelska { background: #fce4ec; }
.cat-lärare { background: #f3e5f5; }

/* Empty state */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
  font-style: italic;
}

/* Footer */
.footer {
  text-align: center;
  margin-top: 64px;
  padding-top: 24px;
  border-top: 1px solid var(--border-light);
  animation: fadeUp 0.6s ease 0.3s both;
}

.footer p {
  font-family: 'Crimson Pro', serif;
  font-size: 0.9rem;
  color: var(--text-light);
  font-style: italic;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 500px) {
  .app-card { grid-template-columns: 44px 1fr auto; gap: 12px; padding: 16px; }
  .app-icon { width: 44px; height: 44px; font-size: 1.3rem; }
  .page { padding: 32px 16px 100px; }
}
</style>
</head>
<body>

<div class="page">
  <header class="header">
    <div class="ornament">✦ ✦ ✦</div>
    <h1>Läraren Sebastians <em>fantastiska ting</em> och där du hittar dem</h1>
    <p class="subtitle">Appar, verktyg och övningar för klassrummet</p>
    <div class="divider"></div>
  </header>

  <div class="filters" id="filters"></div>
  <div class="apps" id="apps"></div>

  <footer class="footer">
    <p>Virginska gymnasiet · IM-programmet · Örebro</p>
  </footer>
</div>

<script>
// ============================================================
//  ★  LÄGG TILL FLER APPAR HÄR  ★
//
//  Kopiera ett objekt, ändra fälten, klart.
//  Kategori styr filtreringen OCH ikonfärgen.
//  url är relativ till index.html.
// ============================================================

const APPS = [
  {
    name: "Dubbelteckning",
    desc: "Träna skillnaden mellan enkel och dubbel konsonant. Tre nivåer, lucktexter och dolda dubbelteckningar.",
    url: "appar/dubbelteckning.html",
    icon: "✏️",
    category: "svenska"
  },
  // ── Lägg till fler så här: ──────────────────────────────
  //
  // {
  //   name: "Namn på appen",
  //   desc: "Kort beskrivning.",
  //   url: "appar/filnamn.html",
  //   icon: "🎯",
  //   category: "matte"       // svenska | matte | engelska | verktyg | lärare
  // },
  //
  // ─────────────────────────────────────────────────────────
];

// ============================================================
//  Resten sköter sig själv.
// ============================================================

const CAT_LABELS = {
  svenska: "Svenska",
  matte: "Matte",
  engelska: "Engelska",
  verktyg: "Verktyg",
  "lärare": "Lärare"
};

const CAT_CLASS = {
  svenska: "cat-svenska",
  matte: "cat-matte",
  engelska: "cat-engelska",
  verktyg: "cat-verktyg",
  "lärare": "cat-lärare"
};

let activeFilter = "alla";

function getCategories() {
  const cats = [...new Set(APPS.map(a => a.category))];
  return cats;
}

function renderFilters() {
  const cats = getCategories();
  if (cats.length < 2) { document.getElementById('filters').style.display = 'none'; return; }

  const c = document.getElementById('filters');
  c.innerHTML = '';

  const allBtn = el('button', { class: 'filter-btn active', 'data-cat': 'alla' }, 'Alla');
  allBtn.onclick = () => setFilter('alla');
  c.appendChild(allBtn);

  cats.forEach(cat => {
    const btn = el('button', { class: 'filter-btn', 'data-cat': cat }, CAT_LABELS[cat] || cat);
    btn.onclick = () => setFilter(cat);
    c.appendChild(btn);
  });
}

function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  renderApps();
}

function renderApps() {
  const c = document.getElementById('apps');
  const filtered = activeFilter === 'alla' ? APPS : APPS.filter(a => a.category === activeFilter);

  if (filtered.length === 0) {
    c.innerHTML = '<div class="empty">Inga appar här ännu.</div>';
    return;
  }

  c.innerHTML = '';
  filtered.forEach((app, i) => {
    const card = document.createElement('a');
    card.href = app.url;
    card.className = 'app-card';
    card.style.animationDelay = (i * 0.06) + 's';

    const catClass = CAT_CLASS[app.category] || 'cat-verktyg';
    const catLabel = CAT_LABELS[app.category] || app.category;

    card.innerHTML = `
      <div class="app-icon ${catClass}">${app.icon}</div>
      <div class="app-info">
        <div class="app-name">${app.name}</div>
        <div class="app-desc">${app.desc}</div>
        <div class="app-tags"><span class="tag">${catLabel}</span></div>
      </div>
      <span class="arrow">→</span>
    `;
    c.appendChild(card);
  });
}

function el(tag, attrs, text) {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
  if (text) e.textContent = text;
  return e;
}

renderFilters();
renderApps();
</script>
</body>
</html>
